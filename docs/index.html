<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#c9d1d9;font:14px ui-monospace,monospace;touch-action:none}
  main{text-align:center}
  canvas{background:#161b22;border:1px solid #30363d;border-radius:8px;max-width:92vw}
  b{color:#39d353}
</style>
<main>
  <h2>🐍 Snake</h2>
  <p>Score <b id="s">0</b> · Best <b id="b">0</b></p>
  <canvas id="c" width="400" height="400"></canvas>
  <p>Arrows / WASD / swipe · Space to restart</p>
  <p><a style="color:#58a6ff" href="https://github.com/ednaaaj">← @ednaaaj</a></p>
</main>
<script>
const N=20,Z=20,c=document.getElementById('c').getContext('2d');
let best=+localStorage.snakeBest||0,snake,dir,next,food,score,dead,t;
const $=id=>document.getElementById(id);
function reset(){snake=[{x:10,y:10}];dir=next={x:1,y:0};score=0;dead=false;place();clearInterval(t);t=setInterval(step,110);$('s').textContent=0;$('b').textContent=best}
function place(){do food={x:Math.random()*N|0,y:Math.random()*N|0};while(snake.some(p=>p.x==food.x&&p.y==food.y))}
function step(){
  dir=next;const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
  if(snake.some(p=>p.x==h.x&&p.y==h.y))dead=true;
  else{snake.unshift(h);if(h.x==food.x&&h.y==food.y){$('s').textContent=++score;if(score>best){best=score;localStorage.snakeBest=best;$('b').textContent=best}place()}else snake.pop()}
  draw();if(dead)clearInterval(t)
}
function draw(){
  c.clearRect(0,0,400,400);
  c.fillStyle='#f85149';c.fillRect(food.x*Z+2,food.y*Z+2,Z-4,Z-4);
  snake.forEach((p,i)=>{c.fillStyle=i?'#26a641':'#39d353';c.fillRect(p.x*Z+1,p.y*Z+1,Z-2,Z-2)});
  if(dead){c.fillStyle='#000a';c.fillRect(0,0,400,400);c.fillStyle='#fff';c.font='20px monospace';c.textAlign='center';c.fillText('Game over — space to retry',200,205)}
}
function turn(x,y){if(x!=-dir.x||y!=-dir.y)next={x,y}}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{if(K[e.key]){turn(...K[e.key]);e.preventDefault()}else if(e.key==' ')reset()});
let sx,sy;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;if(dead)reset()});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
reset();
</script>
